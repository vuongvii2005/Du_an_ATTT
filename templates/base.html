<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Lightweight Web Vulnerability Scanner{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-shell">
        <header class="topbar">
            <div class="topbar__brand">
                <span class="topbar__mark">◱</span>
                <div>
                    <div class="topbar__title">Lightweight Web Vulnerability Scanner</div>
                    <div class="topbar__subtitle">Bounded active recon &middot; header, TLS, dir, robots, CMS &amp; port checks</div>
                </div>
            </div>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>

        <footer class="footer">
            Chỉ sử dụng công cụ này trên hệ thống bạn sở hữu hoặc đã được cấp phép rõ ràng để kiểm tra.
        </footer>
    </div>
</body>
</html>
